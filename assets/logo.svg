<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Outer Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Neural Network Gradient -->
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Glow Backdrop -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Outer Shield Shadow -->
  <path d="M256 40 L416 110 V250 C416 355 344 438 256 470 C168 438 96 355 96 250 V110 Z" 
        fill="none" stroke="#475569" stroke-width="2" opacity="0.3" />

  <!-- Shield Border / Frame -->
  <path d="M256 48 L408 114 V248 C408 348 339 428 256 458 C173 428 104 348 104 248 V114 Z" 
        fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Accent Ring -->
  <path d="M256 76 L384 132 V244 C384 326 327 392 256 418 C185 392 128 326 128 244 V132 Z" 
        fill="none" stroke="url(#netGrad)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Neural Network Lattice Graph -->
  <g stroke="url(#netGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Octagon Links -->
    <line x1="256" y1="130" x2="330" y2="175"/>
    <line x1="330" y1="175" x2="350" y2="250"/>
    <line x1="350" y1="250" x2="320" y2="320"/>
    <line x1="320" y1="320" x2="256" y2="360"/>
    <line x1="256" y1="360" x2="192" y2="320"/>
    <line x1="192" y1="320" x2="162" y2="250"/>
    <line x1="162" y1="250" x2="182" y2="175"/>
    <line x1="182" y1="175" x2="256" y2="130"/>

    <!-- Inner Core Connections -->
    <line x1="256" y1="130" x2="256" y2="210"/>
    <line x1="182" y1="175" x2="256" y2="210"/>
    <line x1="330" y1="175" x2="256" y2="210"/>

    <line x1="256" y1="210" x2="210" y2="270"/>
    <line x1="256" y1="210" x2="302" y2="270"/>

    <line x1="162" y1="250" x2="210" y2="270"/>
    <line x1="350" y1="250" x2="302" y2="270"/>

    <line x1="210" y1="270" x2="256" y2="360"/>
    <line x1="302" y1="270" x2="256" y2="360"/>
    <line x1="210" y1="270" x2="302" y2="270"/>

    <line x1="192" y1="320" x2="210" y2="270"/>
    <line x1="320" y1="320" x2="302" y2="270"/>
  </g>

  <!-- Network Nodes (Glow circles) -->
  <g fill="#10b981">
    <circle cx="256" cy="130" r="8" fill="#818cf8"/>
    <circle cx="330" cy="175" r="7" fill="#6366f1"/>
    <circle cx="350" cy="250" r="7" fill="#34d399"/>
    <circle cx="320" cy="320" r="7" fill="#10b981"/>
    <circle cx="256" cy="360" r="9" fill="#34d399"/>
    <circle cx="192" cy="320" r="7" fill="#10b981"/>
    <circle cx="162" cy="250" r="7" fill="#34d399"/>
    <circle cx="182" cy="175" r="7" fill="#6366f1"/>

    <!-- Core Nodes -->
    <circle cx="256" cy="210" r="10" fill="#38bdf8"/>
    <circle cx="210" cy="270" r="8" fill="#818cf8"/>
    <circle cx="302" cy="270" r="8" fill="#34d399"/>
  </g>

  <!-- Central Pulse Ring -->
  <circle cx="256" cy="210" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
</svg>
