<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.25"/>
    </pattern>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Net Gradient -->
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="220" cy="200" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="200" r="220" fill="#10b981" opacity="0.08" filter="url(#glow)" />

  <!-- Left Side: Shield Icon (Centered around X=220, Y=200) -->
  <g transform="translate(110, 80) scale(0.48)">
    <path d="M256 48 L408 114 V248 C408 348 339 428 256 458 C173 428 104 348 104 248 V114 Z" 
          fill="url(#shieldFill)" stroke="url(#shieldBorder)" stroke-width="12" stroke-linejoin="round" />
    
    <g stroke="url(#netGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="256" y1="130" x2="330" y2="175"/>
      <line x1="330" y1="175" x2="350" y2="250"/>
      <line x1="350" y1="250" x2="320" y2="320"/>
      <line x1="320" y1="320" x2="256" y2="360"/>
      <line x1="256" y1="360" x2="192" y2="320"/>
      <line x1="192" y1="320" x2="162" y2="250"/>
      <line x1="162" y1="250" x2="182" y2="175"/>
      <line x1="182" y1="175" x2="256" y2="130"/>

      <line x1="256" y1="130" x2="256" y2="210"/>
      <line x1="182" y1="175" x2="256" y2="210"/>
      <line x1="330" y1="175" x2="256" y2="210"/>
      <line x1="256" y1="210" x2="210" y2="270"/>
      <line x1="256" y1="210" x2="302" y2="270"/>
      <line x1="162" y1="250" x2="210" y2="270"/>
      <line x1="350" y1="250" x2="302" y2="270"/>
      <line x1="210" y1="270" x2="256" y2="360"/>
      <line x1="302" y1="270" x2="256" y2="360"/>
      <line x1="210" y1="270" x2="302" y2="270"/>
    </g>

    <g fill="#10b981">
      <circle cx="256" cy="130" r="9" fill="#818cf8"/>
      <circle cx="330" cy="175" r="8" fill="#6366f1"/>
      <circle cx="350" cy="250" r="8" fill="#34d399"/>
      <circle cx="320" cy="320" r="8" fill="#10b981"/>
      <circle cx="256" cy="360" r="10" fill="#34d399"/>
      <circle cx="192" cy="320" r="8" fill="#10b981"/>
      <circle cx="162" cy="250" r="8" fill="#34d399"/>
      <circle cx="182" cy="175" r="8" fill="#6366f1"/>
      <circle cx="256" cy="210" r="12" fill="#38bdf8"/>
      <circle cx="210" cy="270" r="9" fill="#818cf8"/>
      <circle cx="302" cy="270" r="9" fill="#34d399"/>
    </g>
  </g>

  <!-- Typography Center-Left -->
  <text x="370" y="180" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">
    DrugGuard
  </text>

  <!-- Gradient Subtitle Bar -->
  <text x="372" y="225" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#94a3b8" letter-spacing="0.5">
    Algospeak-Resilient Multimodal Drug Trafficking Detection
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(372, 260)">
    <!-- Badge 1: DistilBERT NLP -->
    <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="14" y="22" font-family="sans-serif" font-weight="700" font-size="12" fill="#818cf8">🧠 DistilBERT NLP</text>

    <!-- Badge 2: MobileNetV2 Vision -->
    <rect x="180" y="0" width="185" height="34" rx="17" fill="rgba(167,139,250,0.15)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="194" y="22" font-family="sans-serif" font-weight="700" font-size="12" fill="#c084fc">👁️ MobileNetV2 Vision</text>

    <!-- Badge 3: Manifest V3 Chrome Extension -->
    <rect x="380" y="0" width="185" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="394" y="22" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">🛡️ Chrome Extension</text>
  </g>

  <!-- Right Decorative Network Graphic -->
  <g transform="translate(980, 100)" opacity="0.35" stroke="url(#netGrad)" stroke-width="2">
    <line x1="0" y1="40" x2="60" y2="10"/>
    <line x1="60" y1="10" x2="110" y2="70"/>
    <line x1="110" y1="70" x2="50" y2="140"/>
    <line x1="50" y1="140" x2="-20" y2="110"/>
    <line x1="-20" y1="110" x2="0" y2="40"/>
    <line x1="0" y1="40" x2="50" y2="140"/>
    <line x1="60" y1="10" x2="-20" y2="110"/>
    <circle cx="0" cy="40" r="5" fill="#38bdf8"/>
    <circle cx="60" cy="10" r="5" fill="#818cf8"/>
    <circle cx="110" cy="70" r="6" fill="#34d399"/>
    <circle cx="50" cy="140" r="5" fill="#10b981"/>
    <circle cx="-20" cy="110" r="5" fill="#6366f1"/>
  </g>
</svg>
